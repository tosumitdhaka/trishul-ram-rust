# SPDX-License-Identifier: Apache-2.0
name: P1 Round 1 bounded validation
on:
  push:
    branches: [phase/p1-ephemeral-core]
  pull_request:
    branches: [design/phase-0-architecture]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - name: Verify frozen fixture blob pins
        run: |
          test "$(git hash-object docs/phase-0/fixtures/p1/pipeline.yaml)" = "4ca175df56a8bc86655da49f6713d8a5c64a0e41"
          test "$(git hash-object docs/phase-0/fixtures/p1/input.json)" = "5e9127b5ecb429199f1e150726b8091ddf898430"
          test "$(git hash-object docs/phase-0/fixtures/p1/expected-a.json)" = "72ef5ae522bc6cb032b18c49150ea6cadecce993"
          test "$(git hash-object docs/phase-0/fixtures/p1/expected-b.json)" = "1dc44035a3fa51938f640d838562bee7d54baa16"
      - name: Lockfile verification
        id: lock
        run: |
          test -f Cargo.lock
          cargo +1.88.0 metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Format check
        run: cargo +1.88.0 fmt --all -- --check
      - name: Clippy strict
        if: always()
        run: cargo +1.88.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests
        if: always()
        run: cargo +1.88.0 test --workspace --locked
      - name: Focused P1 config tests
        if: always()
        run: cargo +1.88.0 test -p tram-config --locked

      - name: Focused P1 engine pure and sandbox integration
        if: always()
        run: cargo +1.88.0 test -p tram-engine --locked
      - name: P1 resource, fault and RSS regression evidence
        if: always()
        run: cargo +1.88.0 test -p tram-engine --test r2_resources --locked -- --nocapture
      - name: R2 G4 exact locked crate archive, notice and RustSec snapshot
        if: always()
        shell: bash
        run: |
          cargo +1.88.0 fetch --locked --target x86_64-pc-windows-msvc
          git clone --depth 1 https://github.com/RustSec/advisory-db.git /tmp/tram-p1-rustsec-advisory-db
          python3 scripts/p1-provenance-audit.py
      - name: Upload separately reviewable locked dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-exact-dependency-evidence
          path: p1-dependency-evidence.json
          if-no-files-found: error
      - name: P1 real isolated tmpfs disk-full ENOSPC=28 evidence
        if: always()
        run: bash scripts/p1-enospc.sh
      - name: P1 real OS subprocess SIGKILL evidence
        if: always()
        run: cargo +1.88.0 test -p tram-engine --test harness_goldens p1_crash_03_os_kill --locked -- --nocapture
  python-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen Rust fixtures
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned public Python reference
        uses: actions/checkout@v4
        with:
          repository: tosumitdhaka/trishul-ram
          ref: ff380725b86c9569901ea89ad6771623847cc4e2
          path: python-reference
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated reference dependencies
        run: |
          python -m venv /tmp/tram-python-oracle-venv
          /tmp/tram-python-oracle-venv/bin/python -m pip install --disable-pip-version-check -e ./python-reference
      - name: Pinned isolated Python golden execution
        run: |
          /tmp/tram-python-oracle-venv/bin/python -m pip freeze
          /tmp/tram-python-oracle-venv/bin/python scripts/p1-python-oracle.py
