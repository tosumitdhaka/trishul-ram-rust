# SPDX-License-Identifier: Apache-2.0
name: P1 Round 1 bounded validation
on:
  push:
    branches: [phase/p1-ephemeral-core]
  pull_request:
    branches: [design/phase-0-architecture]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - name: Verify frozen fixture blob pins
        run: |
          test "$(git hash-object docs/phase-0/fixtures/p1/pipeline.yaml)" = "4ca175df56a8bc86655da49f6713d8a5c64a0e41"
          test "$(git hash-object docs/phase-0/fixtures/p1/input.json)" = "5e9127b5ecb429199f1e150726b8091ddf898430"
          test "$(git hash-object docs/phase-0/fixtures/p1/expected-a.json)" = "72ef5ae522bc6cb032b18c49150ea6cadecce993"
          test "$(git hash-object docs/phase-0/fixtures/p1/expected-b.json)" = "1dc44035a3fa51938f640d838562bee7d54baa16"
      - name: Lockfile verification
        id: lock
        run: |
          test -f Cargo.lock
          cargo +1.88.0 metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Format check
        run: cargo +1.88.0 fmt --all -- --check
      - name: Clippy strict
        if: always()
        run: cargo +1.88.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests
        if: always()
        run: cargo +1.88.0 test --workspace --locked
      - name: Focused P1 config tests
        if: always()
        run: cargo +1.88.0 test -p tram-config --locked
      - name: Format and generated lock diagnostics for remediation
        if: always()
        shell: bash
        run: |
          cargo +1.88.0 fmt --all || true
          for f in crates/tram-model/src/lib.rs crates/tram-registry/src/lib.rs crates/tram-config/src/lib.rs crates/tram-config/tests/p1_compilation.rs; do
            echo "TRAM_FORMAT_BEGIN:$f"
            base64 -w0 "$f" || true
            echo
            echo "TRAM_FORMAT_END:$f"
          done
          if ! test -f Cargo.lock; then cargo +1.88.0 generate-lockfile; fi
          if test -f Cargo.lock; then
            echo TRAM_LOCK_BEGIN
            base64 -w0 Cargo.lock
            echo
            echo TRAM_LOCK_END
          fi
          echo TRAM_DEPS_BEGIN
          cargo +1.88.0 metadata --format-version 1 --locked | python3 -c 'import sys,json; data=json.load(sys.stdin); [print(p["name"],p["version"],p["license"],p["source"]) for p in data["packages"]]' || true
          echo TRAM_DEPS_END
